name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report each Node version independently
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # offline: Freshdesk is mocked, no secrets needed
      - run: npm run build
